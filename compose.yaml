name: supplier-invoice-verification

x-document-storage: &document-storage
  DOCUMENT_STORAGE_BACKEND: ${DOCUMENT_STORAGE_BACKEND:-local}
  DOCUMENT_STORAGE_ROOT: /var/lib/supplier-invoice-verification/documents
  DOCUMENT_TEMP_ROOT: /tmp/siv-documents
  DOCUMENT_S3_BUCKET: ${DOCUMENT_S3_BUCKET:-}
  DOCUMENT_S3_REGION: ${DOCUMENT_S3_REGION:-}
  DOCUMENT_S3_PREFIX: ${DOCUMENT_S3_PREFIX:-}

services:
  api:
    image: ${COMPOSE_PROJECT_NAME:-supplier-invoice-verification}-api
    build:
      context: ./backend
    environment:
      <<: *document-storage
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      COGNITO_REGION: ${COGNITO_REGION:-}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app
      - document_data:/var/lib/supplier-invoice-verification/documents
    tmpfs:
      - /tmp/siv-documents:size=32m,mode=0700
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: [processing]
    image: ${COMPOSE_PROJECT_NAME:-supplier-invoice-verification}-api
    build:
      context: ./backend
    command: ["python", "-m", "app.document_worker"]
    mem_limit: 512m
    environment: &processing-environment
      <<: *document-storage
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - document_data:/var/lib/supplier-invoice-verification/documents
    tmpfs:
      - /tmp/siv-documents:size=32m,mode=0700
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  dispatcher:
    profiles: [processing]
    image: ${COMPOSE_PROJECT_NAME:-supplier-invoice-verification}-api
    build:
      context: ./backend
    command: ["python", "-m", "app.dispatch_documents"]
    mem_limit: 256m
    environment: *processing-environment
    volumes:
      - document_data:/var/lib/supplier-invoice-verification/documents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  document_data:
