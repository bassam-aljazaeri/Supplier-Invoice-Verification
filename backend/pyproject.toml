[project]
name = "supplier-invoice-verification-api"
version = "0.1.0"
description = "Local API foundation for Supplier-Invoice-Verification"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2.0",
    "boto3>=1.44.3,<2.0",
    "celery[redis]>=5.6,<6.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.0,<3.0",
    "pillow>=12.2,<14.0",
    "pypdf>=6.0,<7.0",
    "python-multipart>=0.0.33,<0.1",
    "redis>=5.2,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: requires explicit opt-in and an approved disposable PostgreSQL database"]
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]
