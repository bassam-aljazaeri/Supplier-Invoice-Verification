# Combine with compose.yaml using an explicit, unique project name.
# CI checks HTTP inside the API container, so no host port is needed.
services:
  api:
    ports: !reset []
    volumes: !reset []
    # Separate guarded entrypoint; the production app has no test mode or JWKS override.
    command: ["python", "-m", "tests.run_http_api"]
    environment:
      RUN_POSTGRES_TESTS: "1"
      POSTGRES_TEST_PROJECT: ${COMPOSE_PROJECT_NAME:?Use an isolated check or CI project}
      COGNITO_REGION: eu-west-1
      COGNITO_USER_POOL_ID: eu-west-1_EXAMPLE
      COGNITO_APP_CLIENT_ID: syntheticclient
